# Prathipan Holdings HQ — MCP connector. Installed by deploy/harden.sh (keeps certbot's certificate paths).
server {
    listen 80;
    listen [::]:80;
    server_name mcp.prathipanholdings.cloud;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.prathipanholdings.cloud;
    ssl_certificate     /etc/letsencrypt/live/mcp.prathipanholdings.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.prathipanholdings.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/hq-mcp.access.log hq_nopath;   # never log the token-bearing path
    error_log  /var/log/nginx/hq-mcp.error.log crit;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 1m;
    limit_req zone=hq_mcp burst=40 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
