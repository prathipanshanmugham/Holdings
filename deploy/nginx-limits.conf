# Prathipan Holdings HQ — shared nginx settings (installed to /etc/nginx/conf.d/hq-limits.conf)
limit_req_zone $binary_remote_addr zone=hq_site:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hq_mcp:10m rate=10r/s;
# connector log without the URL path (the path carries the access token)
log_format hq_nopath '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent "$http_user_agent" $request_time';
