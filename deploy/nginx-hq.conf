# Prathipan Holdings HQ — web app. Installed by deploy/harden.sh (keeps certbot's certificate paths).
server {
    listen 80;
    listen [::]:80;
    server_name hq.prathipanholdings.cloud;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hq.prathipanholdings.cloud;
    ssl_certificate     /etc/letsencrypt/live/hq.prathipanholdings.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hq.prathipanholdings.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hq;
    index index.html;
    include /opt/prathipan-hq/deploy/hq-security.conf;   # CSP, HSTS and other security headers (regenerated by every build)
    limit_req zone=hq_site burst=80 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    location = /index.html { expires -1; }
    location = /config.js  { expires -1; }
    location /vendor/      { expires 30d; }
    location ~ /\.         { return 404; }
    location ~* \.(sh|conf|sql|md|log|bak|ts|json)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
